---
# Ordered stop (reverse of start). MySQL is stopped last of the data services.
- name: Kafka
  hosts: kafka_brokers
  tasks:
    - ansible.builtin.systemd: { name: kafka, state: stopped }
- name: Spark History Server
  hosts: spark_history_servers
  tasks:
    - ansible.builtin.systemd: { name: spark-history-server, state: stopped }
- ansible.builtin.import_playbook: hive/3.1.3/stop.yml
- ansible.builtin.import_playbook: hadoop/3.3.6/stop.yml
- name: MySQL
  hosts: mysql
  tasks:
    - ansible.builtin.systemd: { name: mysqld, state: stopped }
- ansible.builtin.import_playbook: zookeeper/3.8.4/stop.yml
