---
# Run on the first NameNode after the DataNodes registered.
- name: Wait for HDFS to leave safe mode
  ansible.builtin.shell: |
    for i in $(seq 1 60); do
      out=$({{ hadoop_home }}/bin/hdfs dfsadmin -safemode get 2>&1 | head -1)
      case "$out" in
        *"Safe mode is OFF"*) exit 0 ;;
      esac
      sleep 5
    done
    exit 1
  environment: "{{ hadoop_env }}"
  become: true
  become_user: "{{ hadoop_user }}"
  register: safemode_wait
  retries: 3
  delay: 10
  until: safemode_wait.rc == 0
  changed_when: false

- name: Create base HDFS directories
  ansible.builtin.shell: |
    {{ hadoop_home }}/bin/hdfs dfs -mkdir -p {{ item.path }}
    {{ hadoop_home }}/bin/hdfs dfs -chown {{ item.owner }} {{ item.path }}
    {{ hadoop_home }}/bin/hdfs dfs -chmod {{ item.mode }} {{ item.path }}
  environment: "{{ hadoop_env }}"
  become: true
  become_user: "{{ hadoop_user }}"
  loop: "{{ hdfs_base_dirs + (hdfs_extra_dirs | default([])) }}"
  changed_when: true