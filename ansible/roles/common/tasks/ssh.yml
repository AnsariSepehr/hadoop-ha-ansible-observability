---
# One RSA key pair (PEM format - required by Hadoop's sshfence/JSch) is generated
# on the control node and shared by the service user on all nodes.
- name: Create the key directory on the control node
  ansible.builtin.file:
    path: "{{ generated_dir }}/ssh"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true

- name: Generate cluster SSH key pair on the control node
  ansible.builtin.command:
    cmd: >-
      ssh-keygen -q -t rsa -b 4096 -m PEM -N "" -C "{{ cluster_name }}-cluster"
      -f {{ generated_dir }}/ssh/id_rsa
    creates: "{{ generated_dir }}/ssh/id_rsa"
  delegate_to: localhost
  become: false
  run_once: true

- name: Create ~/.ssh
  ansible.builtin.file:
    path: "{{ hadoop_user_home }}/.ssh"
    state: directory
    owner: "{{ hadoop_user }}"
    group: "{{ hadoop_group }}"
    mode: "0700"

- name: Install private key
  ansible.builtin.copy:
    src: "{{ generated_dir }}/ssh/id_rsa"
    dest: "{{ hadoop_user_home }}/.ssh/id_rsa"
    owner: "{{ hadoop_user }}"
    group: "{{ hadoop_group }}"
    mode: "0600"

- name: Install public key
  ansible.builtin.copy:
    src: "{{ generated_dir }}/ssh/id_rsa.pub"
    dest: "{{ hadoop_user_home }}/.ssh/id_rsa.pub"
    owner: "{{ hadoop_user }}"
    group: "{{ hadoop_group }}"
    mode: "0644"

- name: Authorise the cluster key
  ansible.builtin.lineinfile:
    path: "{{ hadoop_user_home }}/.ssh/authorized_keys"
    line: "{{ lookup('ansible.builtin.file', generated_dir ~ '/ssh/id_rsa.pub') | trim }}"
    create: true
    owner: "{{ hadoop_user }}"
    group: "{{ hadoop_group }}"
    mode: "0600"

- name: SSH client defaults for the service user
  ansible.builtin.copy:
    dest: "{{ hadoop_user_home }}/.ssh/config"
    owner: "{{ hadoop_user }}"
    group: "{{ hadoop_group }}"
    mode: "0600"
    content: |
      Host *
          IdentityFile ~/.ssh/id_rsa
          IdentitiesOnly yes
          StrictHostKeyChecking accept-new
          ServerAliveInterval 30
          ServerAliveCountMax 3
          ConnectTimeout 10
