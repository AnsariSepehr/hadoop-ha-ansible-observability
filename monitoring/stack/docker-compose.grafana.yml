# Monitoring stack for Docker Swarm: Prometheus + Grafana (Keycloak sign-in) + node-exporter.
#
#   docker stack deploy -c monitoring/stack/docker-compose.grafana.yml monitoring
#
# Values come from the shell environment at deploy time (see monitoring.env.example):
#   set -a; . monitoring/stack/monitoring.env; set +a
# Secrets are Swarm secrets, never environment values:
#   printf '%s' '<value>' | docker secret create grafana_admin_password -
#   printf '%s' '<value>' | docker secret create grafana_oauth_client_secret -
version: '3.8'

networks:
  elk:
    external: true          # existing overlay network shared with the rest of the monitoring stack

secrets:
  grafana_admin_password:
    external: true
  grafana_oauth_client_secret:
    external: true

services:
  prometheus:
    image: prom/prometheus:v3.5.5
    volumes:
      - ${DATA_DIR:-/data}/prometheus/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${DATA_DIR:-/data}/prometheus/config/file_sd:/etc/prometheus/file_sd:ro
      - ${DATA_DIR:-/data}/prometheus/config/alerts:/etc/prometheus/alerts:ro
      - ${DATA_DIR:-/data}/prometheus/config/k8s:/etc/prometheus/k8s:ro      # optional: Kubernetes token and CA
      - ${DATA_DIR:-/data}/prometheus/data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'                 # allows POST /-/reload
      - '--web.enable-remote-write-receiver'
    networks: [elk]
    deploy:
      restart_policy: { condition: any }

  grafana:
    image: grafana/grafana:13.2.0
    volumes:
      - ${DATA_DIR:-/data}/grafana/data:/var/lib/grafana
      - ${DATA_DIR:-/data}/grafana/provisioning:/etc/grafana/provisioning
      - ${DATA_DIR:-/data}/grafana/dashboards:/var/lib/grafana/dashboards
    secrets: [grafana_admin_password, grafana_oauth_client_secret]
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN}
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET__FILE: /run/secrets/grafana_oauth_client_secret
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://${KEYCLOAK_HOST}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://${KEYCLOAK_HOST}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: https://${KEYCLOAK_HOST}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], 'grafana-admins') && 'GrafanaAdmin' || 'Viewer'"
      GF_AUTH_GENERIC_OAUTH_SIGNOUT_REDIRECT_URL: "https://${KEYCLOAK_HOST}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/logout?client_id=grafana&post_logout_redirect_uri=https%3A%2F%2F${GRAFANA_DOMAIN}%2Flogin"
    networks: [elk]
    deploy:
      restart_policy: { condition: any }

  node-exporter:
    image: prom/node-exporter:v1.8.2
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks: [elk]
    deploy:
      restart_policy: { condition: any }
