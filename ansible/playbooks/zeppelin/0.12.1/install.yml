---
# Install and configure Apache Zeppelin 0.12.1
# Run: ansible-playbook playbooks/zeppelin/0.12.1/install.yml
- name: Install and configure Apache Zeppelin 0.12.1
  hosts: zeppelin
  become: true
  gather_facts: true
  tasks:
    - name: Run zeppelin role (main)
      ansible.builtin.include_role:
        name: zeppelin
        tasks_from: main
