---
# =============================================================================
#  منابع (حافظه) – در حالت auto بر اساس RAM هر نود محاسبه می‌شود
# =============================================================================
resource_mode: auto            # auto | fixed
yarn_nm_memory_fixed_mb: 8192
yarn_sched_min_fixed_mb: 1024
yarn_sched_max_fixed_mb: 2048

yarn_nm_memory_fraction_pct: 70      # درصدی از RAM که به YARN داده می‌شود
yarn_nm_memory_mb: "{{ ([(ansible_memtotal_mb | int * yarn_nm_memory_fraction_pct // 100) // 256 * 256, 2048] | max) if resource_mode == 'auto' else yarn_nm_memory_fixed_mb }}"
yarn_sched_min_mb: "{{ 1024 if resource_mode == 'auto' else yarn_sched_min_fixed_mb }}"
yarn_sched_max_mb: "{{ ([[yarn_nm_memory_mb | int // 2, 2048] | max, yarn_nm_memory_mb | int] | min) if resource_mode == 'auto' else yarn_sched_max_fixed_mb }}"
mapreduce_task_mb: "{{ [2048, yarn_sched_max_mb | int] | min }}"
mapreduce_task_heap_mb: "{{ (mapreduce_task_mb | int * 80) // 100 }}"

hadoop_heap_mb: 1024                 # HADOOP_HEAPSIZE_MAX برای daemon ها

# ---- Spark (باید زیر سقف yarn_sched_max_mb بماند) --------------------------------------
spark_executor_instances: 2
spark_executor_cores: 1
spark_executor_container_cap_mb: 4096
spark_executor_container_mb: "{{ [yarn_sched_max_mb | int, spark_executor_container_cap_mb] | min }}"
spark_executor_overhead_mb: "{{ [384, spark_executor_container_mb | int // 10] | max }}"
spark_executor_memory_mb: "{{ spark_executor_container_mb | int - spark_executor_overhead_mb | int }}"
spark_driver_memory_mb: 1024

hive_heap_mb: 1024
kafka_heap_mb: 2048
kafka_heap_opts: "-Xms{{ kafka_heap_mb }}m -Xmx{{ kafka_heap_mb }}m"
