---
- name: Guard
  ansible.builtin.assert:
    that: confirm_destroy_data | default('no') == 'yes'
    fail_msg: "This removes Kafka and ALL topic data. Add: -e confirm_destroy_data=yes"

- name: Stop and disable
  ansible.builtin.systemd:
    name: kafka
    state: stopped
    enabled: false
  failed_when: false

- name: Remove files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/kafka.service
    - /usr/local/bin/kafka-cli
    - "{{ kafka_home }}"
    - "{{ install_root }}/kafka-{{ kafka_version }}"
    - "{{ kafka_data_dir }}"
    - "{{ kafka_log_dir }}"

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
