---
- name: Guard
  ansible.builtin.assert:
    that: confirm_destroy_data | default('no') == 'yes'
    fail_msg: "This removes MySQL and ALL its data. Add: -e confirm_destroy_data=yes"

- name: Stop MySQL
  ansible.builtin.systemd:
    name: mysqld
    state: stopped
    enabled: false
  failed_when: false

- name: Remove packages, data and configuration
  ansible.builtin.shell: |
    pkill -9 mysqld 2>/dev/null
    dnf remove -y --disablerepo='*' 'mysql-community-*' mysql-selinux 2>&1 | tail -3
    rm -rf {{ mysql_data_dir }}/* {{ mysql_error_log }} /etc/my.cnf /etc/my.cnf.d/kadoop-*.cnf /root/.my.cnf /tmp/kadoop-mysql
    exit 0
  changed_when: true
