---
# Derived values. User-facing settings are in inventory/group_vars/all/41-zeppelin-vars.yml
zeppelin_version: "0.12.1"
zeppelin_install_root: /opt
zeppelin_user: zeppelin
zeppelin_group: zeppelin
zeppelin_port: 8080
zeppelin_server_ssl_port: 8443
zeppelin_jmx_port: 7080
zeppelin_mem: "-Xms1024m -Xmx2048m"
zeppelin_intp_mem: "-Xms512m -Xmx1024m"
zeppelin_java_home: ""

# --- offline package (lives on the Ansible control machine) -------------------
# inventory_dir = <project>/inventory, so ../offline_packages is the project one.
zeppelin_offline_root: "{{ inventory_dir }}/../offline_packages"
zeppelin_tarball_name: "zeppelin-{{ zeppelin_version }}-bin-all.tgz"
zeppelin_tarball_src: "{{ zeppelin_offline_root }}/zeppelin/zeppelin-{{ zeppelin_version }}/{{ zeppelin_tarball_name }}"

# --- target layout --------------------------------------------------------------
# The bin-all tarball extracts to "zeppelin-<version>-bin-all" (not "zeppelin-<version>").
zeppelin_home: "{{ zeppelin_install_root }}/zeppelin-{{ zeppelin_version }}-bin-all"
zeppelin_symlink: "{{ zeppelin_install_root }}/zeppelin"
zeppelin_service_name: zeppelin

# --- JMX exporter (reuses the jar already in offline_packages/monitoring) -------
zeppelin_jmx_version: "1.1.0"
zeppelin_jmx_jar_src: "{{ zeppelin_offline_root }}/monitoring/jmx-exporter-{{ zeppelin_jmx_version }}/jmx_prometheus_javaagent-{{ zeppelin_jmx_version }}.jar"
zeppelin_jmx_dir: /opt/jmx_exporter
zeppelin_jmx_jar: "{{ zeppelin_jmx_dir }}/jmx_prometheus_javaagent.jar"

# --- clean.yml ---------------------------------------------------------------------
# false = keep <zeppelin_home>/notebook; true = delete notebooks too.
zeppelin_clean_data: false

# --- firewall (firewalld, rules added one by one, no reload) --------------------
zeppelin_manage_firewall: true
# Source allowed to scrape the JMX port. Empty = open the JMX port to everyone.
zeppelin_prometheus_ip: ""
